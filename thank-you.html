<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08245a">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <title>Thank You | TriageConnect.ca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --navy:#08245a; --blue:#0e6eff; --red:#ce2837; --ink:#14243b; --muted:#66758a; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:28px;
      font-family:Inter,Arial,sans-serif; color:var(--ink);
      background:linear-gradient(135deg,#eef5ff 0%,#ffffff 48%,#f6f8fb 100%);
    }
    .card {
      width:min(760px,100%); padding:54px; text-align:center; background:white;
      border:1px solid #dbe5f1; border-radius:24px; box-shadow:0 24px 70px rgba(8,36,90,.14);
    }
    .logo { width:min(390px,88%); margin:0 auto 28px; }
    .check {
      width:66px; height:66px; margin:0 auto 22px; display:grid; place-items:center;
      border-radius:50%; color:white; background:var(--red); font-size:32px; font-weight:800;
    }
    h1 { margin:0 0 16px; font-family:Manrope,Arial,sans-serif; color:var(--navy); font-size:clamp(2rem,5vw,3.35rem); }
    p { margin:0 auto 14px; max-width:590px; color:var(--muted); font-size:1.08rem; line-height:1.7; }
    a {
      display:inline-flex; margin-top:24px; padding:14px 24px; border-radius:999px;
      color:white; background:var(--navy); text-decoration:none; font-weight:700;
    }
    @media(max-width:600px){ .card{padding:38px 22px;} }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="assets/triageconnect-logo.svg" alt="TriageConnect.ca">
    <div class="check" aria-hidden="true">✓</div>
    <h1>Thank you for contacting TriageConnect.</h1>
    <p>Your submission has been received. A member of our team will review it and respond within one business day.</p>
    <p>We appreciate your interest in helping improve emergency care across Canada.</p>
    <a href="https://triageconnect.ca/">Return to TriageConnect.ca</a>
  </main>
</body>
</html>
